<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SunnyTests - Online Test</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f5f3ff);color:#172033}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px #0002}
.logo{font-size:22px;font-weight:800}.container{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 10px 35px #00000012;margin-bottom:20px}
.hero{text-align:center;padding:55px 25px}.hero h1{font-size:40px;margin:0 0 10px}.muted{color:#667085}
button{border:0;cursor:pointer}.btn{padding:11px 16px;border-radius:10px;font-weight:700}.primary{background:#4f46e5;color:#fff}.secondary{background:#eef2ff;color:#4338ca}.danger{background:#fee2e2;color:#b91c1c}.success{background:#dcfce7;color:#15803d}
input,textarea,select{width:100%;padding:12px;border:1px solid #dbe0ea;border-radius:10px;margin-top:6px;outline:0}input:focus,textarea:focus,select:focus{border-color:#6366f1}.field{margin-bottom:15px}label{font-weight:700;font-size:14px}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.timer{background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800}.warning{background:#dc2626}
.progress{height:8px;background:#e5e7eb;border-radius:10px;margin:15px 0 25px;overflow:hidden}.bar{height:100%;background:#6366f1;transition:.3s}
.question{font-size:23px;line-height:1.5;margin-bottom:20px}.options{display:grid;gap:12px}.option{text-align:left;padding:15px;border:2px solid #e5e7eb;background:#fff;border-radius:12px}.option.selected{border-color:#6366f1;background:#eef2ff}.actions{display:flex;justify-content:space-between;margin-top:25px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:10px 14px;border-radius:9px;background:#f1f3f7}.tab.active{background:#4f46e5;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qitem{border:1px solid #e4e7ec;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8fafc;padding:18px;border-radius:12px}.stat b{font-size:26px;display:block}.review{padding:15px;border-radius:12px;margin:10px 0;border-left:5px solid}.correct{background:#f0fdf4;border-color:#16a34a}.wrong{background:#fef2f2;border-color:#dc2626}.unanswered{background:#fffbeb;border-color:#f59e0b}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modalbox{background:#fff;border-radius:18px;padding:25px;width:min(500px,100%)}
table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table{overflow:auto}
@media(max-width:700px){.grid,.grid4,.stats{grid-template-columns:1fr}.hero h1{font-size:30px}.qitem{flex-direction:column;align-items:flex-start}.question{font-size:19px}}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ SunnyTests</div>
  <button class="btn" style="background:#ffffff22;color:#fff" onclick="openLogin()">👑 Admin</button>
</header>

<div class="container">
<section id="home" class="card hero">
  <h1>Online Test</h1>
  <p class="muted">Apna naam enter karke test shuru karein.</p>
  <div style="max-width:430px;margin:auto;text-align:left">
    <div class="field"><label>Student Name</label><input id="studentName" placeholder="Apna poora naam likhein"></div>
    <button class="btn primary" style="width:100%" onclick="startTest()">🚀 Start Test</button>
  </div>
</section>

<section id="test" class="card hidden">
  <div class="top">
    <div><b id="studentLabel"></b><div class="muted" id="counter"></div></div>
    <div id="timer" class="timer">00:00</div>
  </div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div id="questionArea"></div>
  <div class="actions">
    <button id="prev" class="btn secondary" onclick="prevQ()">← Previous</button>
    <button id="next" class="btn primary" onclick="nextQ()">Next →</button>
  </div>
</section>

<section id="result" class="card hidden">
  <div style="text-align:center">
    <h1>🎉 Test Completed!</h1><p id="resultStudent" class="muted"></p>
    <div class="stats">
      <div class="stat"><b id="score">0%</b>Score</div>
      <div class="stat"><b id="correct">0</b>Correct</div>
      <div class="stat"><b id="wrong">0</b>Wrong</div>
    </div>
  </div>
  <div id="studentReview" style="margin-top:25px"></div>
  <button class="btn primary" onclick="location.reload()">🏠 Home</button>
</section>

<section id="admin" class="hidden">
  <div class="top" style="margin-bottom:15px"><h2>👑 Admin Dashboard</h2><button class="btn danger" onclick="logoutAdmin()">Logout</button></div>
  <div class="tabs">
    <button id="qtab" class="tab active" onclick="adminTab('questions')">📝 Questions</button>
    <button id="rtab" class="tab" onclick="adminTab('results')">📊 Results</button>
  </div>

  <div id="questionsPanel" class="card">
    <div class="top"><h2>Question Manager</h2><button class="btn primary" onclick="newQuestion()">＋ New Question</button></div>
    <div id="editor" class="hidden" style="margin-top:15px">
      <div class="field"><label>Question</label><textarea id="qtext" rows="3"></textarea></div>
      <div class="grid4">
        <div class="field"><label>Option A</label><input id="a"></div>
        <div class="field"><label>Option B</label><input id="b"></div>
        <div class="field"><label>Option C</label><input id="c"></div>
        <div class="field"><label>Option D</label><input id="d"></div>
      </div>
      <div class="grid">
        <div class="field"><label>Correct Answer</label><select id="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>
        <div class="field"><label>Timer</label><div style="display:flex;gap:8px"><input id="time" type="number" min="1" value="30"><select id="unit"><option value="seconds">Seconds</option><option value="minutes">Minutes</option></select></div></div>
      </div>
      <button class="btn success" onclick="saveQuestion()">💾 Save</button>
      <button class="btn secondary" onclick="cancelEditor()">Cancel</button>
    </div>
    <div id="questionList"></div>
  </div>

  <div id="resultsPanel" class="card hidden">
    <div class="top"><h2>📊 Student Results</h2><button class="btn danger" onclick="clearResults()">Clear Results</button></div>
    <div id="resultsList"></div>
  </div>
</section>
</div>

<div id="loginModal" class="modal hidden">
  <div class="modalbox">
    <h2>👑 Admin Login</h2><p class="muted">Admin PIN enter karein.</p>
    <div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric"></div>
    <button class="btn primary" onclick="adminLogin()">Login</button>
    <button class="btn secondary" onclick="closeLogin()">Cancel</button>
  </div>
</div>

<div id="detailModal" class="modal hidden">
  <div class="modalbox" style="width:min(800px,100%);max-height:90vh;overflow:auto">
    <div class="top"><h2 id="detailTitle">Result</h2><button class="btn secondary" onclick="closeDetail()">✕</button></div>
    <div id="detail"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ============================================================
   1) PASTE YOUR SUPABASE DETAILS HERE
   ============================================================ */
const SUPABASE_URL = "https://bqauhxgqnofhgxurgbwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_wG0Ils9H6vKPxg9fDfQ0Jw_x1py4xcV";
const ADMIN_PIN = "15052004";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let questions=[], results=[], student="", index=0, answers=[], interval=null, timeLeft=0, editingId=null;

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const fmt = s => s<60 ? `${s}s` : `${Math.floor(s/60)}m${s%60?` ${s%60}s`:""}`;

async function loadQuestions(){
  const {data,error}=await supabase.from("questions").select("*").order("created_at",{ascending:true});
  if(error){alert("Questions load nahi hue: "+error.message);console.error(error);return;}
  questions=(data||[]).map(q=>({id:q.id,text:q.question_text,options:{A:q.option_a,B:q.option_b,C:q.option_c,D:q.option_d},correct:q.correct_answer,time:q.timer_seconds}));
  renderQuestions();
}
async function loadResults(){
  const {data,error}=await supabase.from("results").select("*").order("created_at",{ascending:false});
  if(error){console.error(error);return;}
  results=data||[];
  renderResults();
}

window.startTest=async()=>{
  student=$("studentName").value.trim();
  if(!student)return alert("Apna naam enter karein.");
  await loadQuestions();
  if(!questions.length)return alert("Admin ne abhi koi question add nahi kiya hai.");
  index=0;answers=new Array(questions.length).fill(null);
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("admin").classList.add("hidden");$("test").classList.remove("hidden");
  $("studentLabel").textContent="👤 "+student;showQuestion();
};

function showQuestion(){
  clearInterval(interval);
  const q=questions[index];
  $("counter").textContent=`Question ${index+1} / ${questions.length}`;
  $("bar").style.width=((index+1)/questions.length*100)+"%";
  $("questionArea").innerHTML=`<div class="question">${esc(q.text)}</div><div class="options">
  ${["A","B","C","D"].map(l=>`<button class="option ${answers[index]===l?"selected":""}" onclick="selectAnswer('${l}')"><b>${l}</b> — ${esc(q.options[l])}</button>`).join("")}</div>`;
  $("prev").disabled=index===0;
  $("next").textContent=index===questions.length-1?"Submit Test ✓":"Next →";
  startTimer(q.time);
}
window.selectAnswer=l=>{answers[index]=l;showQuestionNoTimer();};
function showQuestionNoTimer(){
  const q=questions[index];
  $("questionArea").innerHTML=`<div class="question">${esc(q.text)}</div><div class="options">
  ${["A","B","C","D"].map(l=>`<button class="option ${answers[index]===l?"selected":""}" onclick="selectAnswer('${l}')"><b>${l}</b> — ${esc(q.options[l])}</button>`).join("")}</div>`;
}
function startTimer(s){
  timeLeft=s;updateTimer();
  interval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(interval);nextQ();}},1000);
}
function updateTimer(){
  $("timer").textContent=`${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;
  $("timer").classList.toggle("warning",timeLeft<=10);
}
window.nextQ=()=>{if(index===questions.length-1){if(confirm("Test submit karein?"))submitTest();}else{index++;showQuestion();}};
window.prevQ=()=>{if(index>0){index--;showQuestion();}};

async function submitTest(){
  clearInterval(interval);
  let correct=0,wrong=0,unanswered=0;
  questions.forEach((q,i)=>{if(!answers[i])unanswered++;else if(answers[i]===q.correct)correct++;else wrong++;});
  const pct=Math.round(correct/questions.length*100);
  const payload={student_name:student,total:questions.length,correct,wrong,unanswered,percentage:pct,answers:answers.map((answer,i)=>({question_id:questions[i].id,answer,correct_answer:questions[i].correct}))};
  const {error}=await supabase.from("results").insert(payload);
  if(error){alert("Result save nahi hua: "+error.message);console.error(error);return;}
  $("test").classList.add("hidden");$("result").classList.remove("hidden");
  $("resultStudent").textContent=student+" • "+new Date().toLocaleString();
  $("score").textContent=pct+"%";$("correct").textContent=correct;$("wrong").textContent=wrong;
  let html="<h2>📋 Question-wise Review</h2>";
  questions.forEach((q,i)=>{const a=answers[i],cl=!a?"unanswered":a===q.correct?"correct":"wrong";
    html+=`<div class="review ${cl}"><b>Q${i+1}. ${esc(q.text)}</b><p>Your Answer: <b>${a?esc(a+". "+q.options[a]):"Not Answered"}</b></p><p>Correct Answer: <b>${esc(q.correct+". "+q.options[q.correct])}</b></p></div>`;
  });
  $("studentReview").innerHTML=html;
}

window.openLogin=()=>{$("loginModal").classList.remove("hidden");$("pin").focus();};
window.closeLogin=()=>{$("loginModal").classList.add("hidden");$("pin").value="";};
window.adminLogin=async()=>{
  if($("pin").value!==ADMIN_PIN)return alert("Incorrect Admin PIN.");
  closeLogin();$("home").classList.add("hidden");$("test").classList.add("hidden");$("result").classList.add("hidden");$("admin").classList.remove("hidden");
  await loadQuestions();await loadResults();
};
window.logoutAdmin=()=>{$("admin").classList.add("hidden");$("home").classList.remove("hidden");};
window.adminTab=t=>{
  $("questionsPanel").classList.toggle("hidden",t!=="questions");$("resultsPanel").classList.toggle("hidden",t!=="results");
  $("qtab").classList.toggle("active",t==="questions");$("rtab").classList.toggle("active",t==="results");
  if(t==="results")loadResults();
};

window.newQuestion=()=>{
  editingId=null;$("editor").classList.remove("hidden");
  ["qtext","a","b","c","d"].forEach(id=>$(id).value="");$("answer").value="A";$("time").value=30;$("unit").value="seconds";
};
window.cancelEditor=()=>{$("editor").classList.add("hidden");editingId=null;};
window.saveQuestion=async()=>{
  const text=$("qtext").value.trim(), A=$("a").value.trim(),B=$("b").value.trim(),C=$("c").value.trim(),D=$("d").value.trim();
  let t=Number($("time").value);if($("unit").value==="minutes")t*=60;
  if(!text||!A||!B||!C||!D||t<1)return alert("Question, 4 options aur timer sahi se bharein.");
  const row={question_text:text,option_a:A,option_b:B,option_c:C,option_d:D,correct_answer:$("answer").value,timer_seconds:t};
  let res;
  if(editingId)res=await supabase.from("questions").update(row).eq("id",editingId);
  else res=await supabase.from("questions").insert(row);
  if(res.error)return alert("Save error: "+res.error.message);
  cancelEditor();await loadQuestions();
};
window.editQuestion=async id=>{
  const q=questions.find(x=>x.id===id);if(!q)return;editingId=id;$("editor").classList.remove("hidden");
  $("qtext").value=q.text;$("a").value=q.options.A;$("b").value=q.options.B;$("c").value=q.options.C;$("d").value=q.options.D;$("answer").value=q.correct;
  $("time").value=q.time>=60&&q.time%60===0?q.time/60:q.time;$("unit").value=q.time>=60&&q.time%60===0?"minutes":"seconds";
};
window.deleteQuestion=async id=>{
  if(!confirm("Question delete karein?"))return;
  const {error}=await supabase.from("questions").delete().eq("id",id);
  if(error)return alert(error.message);await loadQuestions();
};
function renderQuestions(){
  $("questionList").innerHTML=questions.length?questions.map((q,i)=>`<div class="qitem"><div><b>Q${i+1}. ${esc(q.text)}</b><br><span class="muted">Correct: ${q.correct} • Timer: ${fmt(q.time)}</span></div><div><button class="btn secondary" onclick="editQuestion('${q.id}')">Edit</button> <button class="btn danger" onclick="deleteQuestion('${q.id}')">Delete</button></div></div>`).join(""):`<p class="muted">No questions yet.</p>`;
}
function renderResults(){
  $("resultsList").innerHTML=results.length?`<div class="table"><table><thead><tr><th>Student</th><th>Date</th><th>Total</th><th>Correct</th><th>Wrong</th><th>Score</th><th></th></tr></thead><tbody>${results.map(r=>`<tr><td><b>${esc(r.student_name)}</b></td><td>${esc(new Date(r.created_at).toLocaleString())}</td><td>${r.total}</td><td>${r.correct}</td><td>${r.wrong}</td><td>${r.percentage}%</td><td><button class="btn secondary" onclick="viewResult('${r.id}')">View</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No student results yet.</p>`;
}
window.viewResult=id=>{
  const r=results.find(x=>x.id===id);if(!r)return;$("detailTitle").textContent="📊 "+r.student_name;
  const amap=new Map((r.answers||[]).map(x=>[x.question_id,x]));
  let h=`<div class="stats"><div class="stat"><b>${r.percentage}%</b>Score</div><div class="stat"><b>${r.correct}</b>Correct</div><div class="stat"><b>${r.wrong}</b>Wrong</div></div>`;
  questions.forEach((q,i)=>{const a=amap.get(q.id)?.answer,cl=!a?"unanswered":a===q.correct?"correct":"wrong";h+=`<div class="review ${cl}"><b>Q${i+1}. ${esc(q.text)}</b><p>Student: <b>${a?esc(a+". "+q.options[a]):"Not Answered"}</b></p><p>Correct: <b>${esc(q.correct+". "+q.options[q.correct])}</b></p></div>`});
  $("detail").innerHTML=h;$("detailModal").classList.remove("hidden");
};
window.closeDetail=()=>{$("detailModal").classList.add("hidden");};
window.clearResults=async()=>{if(!confirm("Saare results delete karein?"))return;const {error}=await supabase.from("results").delete().neq("id","00000000-0000-0000-0000-000000000000");if(error)return alert(error.message);await loadResults();};

if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_")){
  console.warn("Supabase config missing. Paste URL and publishable key in index.html.");
}
</script>
</body>
</html>
