<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunny Sir — Classes 8, 9, 10</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --bg: #05060a;
    --card: rgba(255,255,255,0.03);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #6e56ff;
    --accent-2: #00d4ff;
    --accent-3: #ffb800;
    --border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ---------- AURORA BG ---------- */
  .aurora {
    position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.45;
    animation: floatBlob 22s ease-in-out infinite;
  }
  .blob:nth-child(1) { width: 500px; height: 500px; background: var(--accent); top: -10%; left: -10%; }
  .blob:nth-child(2) { width: 450px; height: 450px; background: var(--accent-2); top: 40%; right: -15%; animation-delay: -8s; }
  .blob:nth-child(3) { width: 400px; height: 400px; background: var(--accent-3); bottom: -10%; left: 30%; animation-delay: -15s; }
  @keyframes floatBlob {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(80px,-60px) scale(1.1); }
    66% { transform: translate(-60px,60px) scale(0.9); }
  }

  /* ---------- NAV ---------- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    padding: 18px 0;
    transition: all 0.4s ease;
  }
  nav.scrolled {
    padding: 12px 0;
    background: rgba(5,6,10,0.75);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-container {
    width: min(1200px, 92%); margin: auto;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 1.3rem;
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 1.1rem;
  }
  .logo-text span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .nav-links {
    display: flex; gap: 6px; list-style: none;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 6px; border-radius: 50px;
    backdrop-filter: blur(10px);
  }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 0.9rem; font-weight: 500;
    padding: 8px 18px; border-radius: 50px;
    transition: all 0.3s;
  }
  .nav-links a:hover {
    color: var(--text);
    background: rgba(255,255,255,0.06);
  }
  .menu-btn {
    display: none; background: none; border: none;
    color: var(--text); font-size: 1.6rem; cursor: pointer;
  }
  @media (max-width: 820px) {
    .nav-links {
      position: fixed; top: 80px; right: 4%;
      flex-direction: column;
      background: rgba(10,12,20,0.97);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 16px; gap: 4px;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.77,0,0.175,1);
      min-width: 200px;
    }
    .nav-links.open { transform: translateX(0); }
    .nav-links a { padding: 12px 20px; display: block; }
    .menu-btn { display: block; }
  }

  /* ---------- HERO ---------- */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center;
    padding: 130px 0 80px;
    position: relative;
  }
  .hero-container {
    width: min(1200px, 92%); margin: auto;
    display: grid; grid-template-columns: 1.2fr 1fr;
    gap: 60px; align-items: center;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: var(--card);
    backdrop-filter: blur(10px);
    font-size: 0.8rem; color: var(--muted);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }
  .hero-badge .dot {
    width: 8px; height: 8px;
    background: #00ff88; border-radius: 50%;
    box-shadow: 0 0 12px #00ff88;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hero h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }
  .hero h1 .line { display: block; overflow: hidden; }
  .hero h1 .line span {
    display: inline-block;
    transform: translateY(110%);
    animation: revealUp 1s cubic-bezier(0.77,0,0.175,1) forwards;
  }
  .hero h1 .line:nth-child(1) span { animation-delay: 0.3s; }
  .hero h1 .line:nth-child(2) span { animation-delay: 0.45s; }
  .hero h1 .line:nth-child(3) span { animation-delay: 0.6s; }

  @keyframes revealUp {
    to { transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gradient-text {
    background: linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent-3));
    background-size: 300% 300%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--muted);
    max-width: 540px;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s 0.8s forwards;
  }

  .hero-buttons {
    display: flex; gap: 14px; flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.8s 1s forwards;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px;
    border-radius: 50px;
    font-weight: 600; font-size: 0.95rem;
    text-decoration: none;
    position: relative; overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
    border: none; cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    box-shadow: 0 10px 40px -10px var(--accent);
  }
  .btn-primary:hover {
    box-shadow: 0 20px 60px -10px var(--accent);
    transform: translateY(-3px);
  }
  .btn-ghost {
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--card);
    backdrop-filter: blur(10px);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
  }

  /* Hero visual - teacher avatar circle */
  .hero-visual {
    position: relative;
    aspect-ratio: 1;
    max-width: 460px;
    margin: auto;
    opacity: 0;
    animation: fadeIn 1.2s 0.9s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .hero-visual .ring {
    position: absolute; inset: 0;
    border: 1px solid rgba(110,86,255,0.3);
    border-radius: 50%;
    animation: spin 25s linear infinite;
  }
  .hero-visual .ring:nth-child(2) {
    inset: 40px;
    border-color: rgba(0,212,255,0.3);
    animation-duration: 18s;
    animation-direction: reverse;
  }
  .hero-visual .ring:nth-child(3) {
    inset: 80px;
    border-color: rgba(255,184,0,0.3);
    animation-duration: 12s;
  }
  .hero-visual .avatar {
    position: absolute; inset: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(110,86,255,0.3), rgba(0,212,255,0.2));
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 5rem;
    font-weight: 700;
    backdrop-filter: blur(20px);
  }
  .hero-visual .avatar span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .floating-icon {
    position: absolute;
    width: 50px; height: 50px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: grid; place-items: center;
    font-size: 1.4rem;
    backdrop-filter: blur(10px);
    animation: floatUpDown 3s ease-in-out infinite;
  }
  .floating-icon:nth-child(5) { top: 5%; left: 0; animation-delay: 0s; }
  .floating-icon:nth-child(6) { top: 20%; right: 0; animation-delay: -1s; }
  .floating-icon:nth-child(7) { bottom: 15%; left: 5%; animation-delay: -2s; }
  .floating-icon:nth-child(8) { bottom: 5%; right: 10%; animation-delay: -1.5s; }
  @keyframes floatUpDown {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .hero-container { grid-template-columns: 1fr; text-align: center; }
    .hero-sub { margin-left: auto; margin-right: auto; }
    .hero-buttons { justify-content: center; }
    .hero-visual { max-width: 320px; }
    .hero-visual .avatar { inset: 80px; font-size: 3.5rem; }
  }

  /* ---------- STATS ---------- */
  .stats {
    padding: 60px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stats-grid {
    width: min(1200px, 92%); margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 40px;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .stat-label {
    color: var(--muted);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  /* ---------- SECTIONS ---------- */
  section { padding: 110px 0; position: relative; }
  .section-container { width: min(1200px, 92%); margin: auto; }
  .section-header {
    text-align: center;
    margin-bottom: 70px;
  }
  .section-label {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.9rem, 4.5vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .section-sub {
    color: var(--muted);
    max-width: 600px;
    margin: auto;
  }

  .reveal {
    opacity: 0;
    transform: translateY(60px);
    transition: opacity 1s cubic-bezier(0.16,1,0.3,1), transform 1s cubic-bezier(0.16,1,0.3,1);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ---------- ABOUT ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 60px;
    align-items: center;
  }
  .about-visual {
    position: relative;
    aspect-ratio: 4/5;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(110,86,255,0.25), rgba(0,212,255,0.1));
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 10rem;
  }
  .about-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(110,86,255,0.5), transparent 60%);
    animation: pulse 5s infinite;
  }
  .about-visual .em { position: relative; z-index: 1; }

  .about-text h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8rem;
    margin-bottom: 18px;
    letter-spacing: -0.02em;
  }
  .about-text p {
    color: var(--muted);
    margin-bottom: 18px;
    font-size: 1.05rem;
  }
  .about-points {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
  }
  .about-point {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(10px);
  }
  .about-point .check {
    width: 26px; height: 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .about-grid { grid-template-columns: 1fr; gap: 40px; }
    .about-visual { max-width: 320px; margin: auto; font-size: 7rem; }
  }

  /* ---------- CLASSES ---------- */
  .classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }
  .class-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), border-color 0.4s;
  }
  .class-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(110,86,255,0.08));
    opacity: 0;
    transition: opacity 0.4s;
  }
  .class-card:hover {
    transform: translateY(-8px);
    border-color: rgba(110,86,255,0.4);
  }
  .class-card:hover::before { opacity: 1; }
  .class-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 3.5rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
  }
  .class-card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    margin-bottom: 12px;
    position: relative;
  }
  .class-card p {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
    position: relative;
  }
  .subject-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 24px;
    position: relative;
  }
  .subject-tag {
    font-size: 0.75rem;
    padding: 5px 12px;
    background: rgba(110,86,255,0.12);
    border: 1px solid rgba(110,86,255,0.25);
    border-radius: 50px;
    color: #a99fff;
  }
  .class-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    display: inline-flex; align-items: center; gap: 6px;
    position: relative;
    transition: gap 0.3s;
  }
  .class-link:hover { gap: 12px; }

  /* ---------- FEATURES ---------- */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .feature {
    padding: 32px 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: transform 0.4s, border-color 0.4s;
  }
  .feature:hover {
    transform: translateY(-6px);
    border-color: rgba(0,212,255,0.4);
  }
  .feature-icon {
    width: 54px; height: 54px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(110,86,255,0.2), rgba(0,212,255,0.15));
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 1.5rem;
    margin-bottom: 20px;
  }
  .feature h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.15rem;
    margin-bottom: 10px;
  }
  .feature p {
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* ---------- TESTIMONIALS ---------- */
  .testimonials-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
  }
  .testimonial {
    padding: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    transition: transform 0.4s, border-color 0.4s;
  }
  .testimonial:hover {
    transform: translateY(-6px);
    border-color: rgba(255,184,0,0.4);
  }
  .stars {
    color: var(--accent-3);
    margin-bottom: 14px;
    font-size: 1rem;
    letter-spacing: 3px;
  }
  .testimonial p {
    color: var(--text);
    font-size: 0.98rem;
    margin-bottom: 20px;
    line-height: 1.7;
  }
  .student-info {
    display: flex; align-items: center; gap: 12px;
  }
  .student-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700;
    color: white;
    font-size: 1rem;
  }
  .student-name {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .student-class {
    color: var(--muted);
    font-size: 0.8rem;
  }

  /* ---------- CTA / CONTACT ---------- */
  .cta-section {
    padding: 110px 0;
  }
  .cta-box {
    background: linear-gradient(135deg, rgba(110,86,255,0.15), rgba(0,212,255,0.08));
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 70px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
  }
  .cta-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(110,86,255,0.15), transparent 60%);
    animation: spin 30s linear infinite;
  }
  .cta-box > * { position: relative; z-index: 1; }
  .cta-box h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  .cta-box p {
    color: var(--muted);
    margin-bottom: 32px;
    max-width: 520px;
    margin-left: auto; margin-right: auto;
  }
  .contact-buttons {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
  }
  .btn-whatsapp {
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    box-shadow: 0 10px 40px -10px #25D366;
  }
  .btn-whatsapp:hover {
    box-shadow: 0 20px 60px -10px #25D366;
    transform: translateY(-3px);
  }

  /* ---------- FOOTER ---------- */
  footer {
    padding: 50px 0 30px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .footer-content {
    width: min(1200px, 92%); margin: auto;
  }
  .footer-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .footer-logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .footer-text {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .footer-copy {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 24px;
  }

  /* Scroll progress bar */
  .progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    z-index: 9999;
    width: 0%;
    transition: width 0.1s;
  }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<!-- Aurora background -->
<div class="aurora">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<!-- NAVBAR -->
<nav id="nav">
  <div class="nav-container">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Sunny <span>Sir</span></div>
    </div>
    <button class="menu-btn" id="menuBtn">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#classes">Classe
